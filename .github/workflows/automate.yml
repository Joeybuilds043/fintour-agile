name: CI - Horizon Tourism
on:
  push:
    branches: [main, "horizon/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: horizon-tourism-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python files
        run: python -m compileall -q app.py src pages tests
      - name: Run unit tests
        run: pytest -q
      - name: Execute default Streamlit page
        env:
          HORIZON_DISABLE_REMOTE_MEDIA: "1"
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app.py").run(timeout=45)
          assert not app.exception, app.exception
          print("Default Horizon page executed without application exceptions.")
          PY
