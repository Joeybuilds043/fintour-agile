name: CI - Horizon Tourism

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizon-tourism-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile application
        run: python -m compileall -q app.py
      - name: Smoke-test imports and destination coverage
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import pandas
          import plotly
          import requests
          import streamlit
          source = Path("app.py").read_text(encoding="utf-8")
          ast.parse(source)
          required = ["Hunza Valley", "Skardu", "Naran–Kaghan", "Swat Valley", "Murree", "Neelum Valley", "Chitral & Kalash Valleys", "Lahore", "Taxila", "Gwadar & Hingol Coast"]
          assert all(name in source for name in required)
          print("Syntax, imports and destination coverage passed.")
          PY
      - name: Start Streamlit and verify health endpoint
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/horizon-streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo "Streamlit application startup passed."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/horizon-streamlit.log
          exit 1
