name: CI - Fintour Agile

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "LICENSE"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fintour-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Python environment and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify Python runtime
        run: |
          python --version
          python -c "import sys; assert sys.version_info >= (3, 11), sys.version"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Smoke-test core imports
        run: |
          python - <<'PY'
          import numpy
          import pandas
          import plotly
          import pydeck
          import scipy
          import streamlit
          print("Core imports passed.")
          PY

      - name: Track installed dependency versions
        run: python -m pip freeze | sort > dependency-report.txt

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report-${{ github.sha }}
          path: dependency-report.txt
          if-no-files-found: error
          retention-days: 14
